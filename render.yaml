services:
  - type: web
    name: camera-security-demo-1
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: starter # Existing disk is retained for legacy SQLite migration and rollback.
    disk:
      name: sessions-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/sessions.db
      - key: PERSISTENT_STORAGE_ROOT
        value: /var/data
      - key: DATABASE_URL
        sync: false
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: DEMO_SESSION_DURATION_MINUTES
        value: 30
      - key: ADMIN_API_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://news-kerala-vision-malayalam-fronte-five.vercel.app
